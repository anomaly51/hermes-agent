name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: anomaly51/github-actions-toolkit/.github/workflows/app-release.yml@v7
    with:
      app-name: Hermes Agent
      runner: anomaly51-runner
      timeout-minutes: 20
      concurrency-group: hermes-agent
      registry: harbor.api-api-api.com
      image-project: hermes-agent
      image-name: gateway
      platform: linux/amd64
      gitops-repository: anomaly51/workload-2-k3s-argocd
      deployment-path: apps/hermes-agent/deployment.yaml
      deployment-container-name: gateway
      app-url: https://hermes-agent.api-api-api.com
      health-url: https://hermes-agent.api-api-api.com/health
      version-env-name: ""
      health-version-field: ""
    secrets:
      registry_username: ${{ secrets.HARBOR_USERNAME }}
      registry_password: ${{ secrets.HARBOR_PASSWORD }}
      manifest_repository_token: ${{ secrets.DEVOPS_REPO_TOKEN }}
      deployment_server: ${{ secrets.ARGOCD_SERVER }}
      deployment_auth_token: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      deployment_resolve_ip: ${{ secrets.ARGOCD_RESOLVE_IP }}
      deployment_insecure: ${{ secrets.ARGOCD_INSECURE }}
      telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
