name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  HARBOR_REGISTRY: harbor.api-api-api.com
  HARBOR_PROJECT: hermes-agent
  IMAGE_NAME: gateway
  GITOPS_REPOSITORY: anomaly51/workload-2-k3s-argocd
  GITOPS_BRANCH: main
  GITOPS_DEPLOYMENT: apps/hermes-agent/deployment.yaml

jobs:
  build-and-deploy:
    runs-on: anomaly51-runner
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image metadata
        run: |
          image_tag="main-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}"
          image_ref="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}:${image_tag}"
          echo "IMAGE_TAG=${image_tag}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${image_ref}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME || 'admin' }}
          password: ${{ secrets.HARBOR_PASSWORD || 'admin' }}

      - name: Ensure Harbor project exists
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME || 'admin' }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD || 'admin' }}
        run: |
          curl -fsS -u "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" \
            -H "Content-Type: application/json" \
            -X POST "https://${HARBOR_REGISTRY}/api/v2.0/projects" \
            -d "{\"project_name\":\"${HARBOR_PROJECT}\",\"public\":false}" \
            || true

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_REF }}
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            VCS_REF=${{ github.sha }}

      - name: Smoke test image
        run: |
          timeout 120s docker run --rm --platform linux/amd64 --entrypoint /bin/bash "${IMAGE_REF}" \
            -lc '. /opt/hermes/.venv/bin/activate && hermes --help >/dev/null'

      - name: Push image
        run: docker push "${IMAGE_REF}"

      - name: Update Argo CD GitOps image
        env:
          DEVOPS_REPO_TOKEN: ${{ secrets.DEVOPS_REPO_TOKEN }}
        run: |
          test -n "${DEVOPS_REPO_TOKEN}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          workdir="$(mktemp -d)"
          git clone --branch "${GITOPS_BRANCH}" \
            "https://x-access-token:${DEVOPS_REPO_TOKEN}@github.com/${GITOPS_REPOSITORY}.git" \
            "${workdir}/gitops"

          cd "${workdir}/gitops"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path(os.environ["GITOPS_DEPLOYMENT"])
          image_ref = os.environ["IMAGE_REF"]
          old = path.read_text()
          new = re.sub(
              r"(image:\s*)harbor\.api-api-api\.com/hermes-agent/gateway:[^\s]+",
              rf"\1{image_ref}",
              old,
              count=1,
          )
          if old == new:
              raise SystemExit(f"image reference was not updated in {path}")
          path.write_text(new)
          PY

          git diff -- "${GITOPS_DEPLOYMENT}"
          git add "${GITOPS_DEPLOYMENT}"
          git commit -m "chore: update hermes-agent image to ${IMAGE_TAG}"
          git push origin "${GITOPS_BRANCH}"
